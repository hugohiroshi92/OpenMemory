[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openmemory-py"
version = "1.3.2"
description = "OpenMemory Python SDK"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "numpy",
    "httpx",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "notion-client>=2.0",
    "msal>=1.0",
    "PyGithub>=2.0",
    "beautifulsoup4>=4.0",
    "pypdf>=4.0",
    "mammoth>=1.6",
    "markdownify>=0.11",
    "openai>=1.0",
    "pytest>=9.0.2",
    "python-dotenv>=0.19.0",
    "pyyaml>=6.0.1",
    "boto3>=1.35.0",
    "pytest-asyncio>=1.3.0",
    "google>=3.0.0",
]

[project.optional-dependencies]
# Portuguese language pack with lemmatization (spaCy + pt_core_news_sm).
# After install, download the model once:
#   python -m spacy download pt_core_news_sm
pt = ["spacy>=3.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/openmemory"]
